<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06101d"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><title>JARVIS · Dashboard V0.3.1</title>
<style>
:root{--cyan:#5fe7ff;--muted:#87aab9;--line:#1c5065;--panel:#0a2030d9}*{box-sizing:border-box}body{margin:0;background:#050c16;color:#e1f7ff;font:14px system-ui,-apple-system,sans-serif;min-height:100vh;background-image:radial-gradient(ellipse at 48% 5%,#12415b70,transparent 65%),linear-gradient(#0d253322 1px,transparent 1px),linear-gradient(90deg,#0d253322 1px,transparent 1px);background-size:auto,36px 36px,36px 36px}button,input,select{font:inherit}button{cursor:pointer;color:inherit}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 26px;border-bottom:1px solid var(--line)}.brand{font-size:25px;letter-spacing:.25em;color:var(--cyan);font-weight:750;text-shadow:0 0 20px #24c7ff55}.micro{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}.clock{font-size:30px;font-variant-numeric:tabular-nums;font-weight:650;text-align:right}nav{display:flex;gap:8px;padding:12px 26px;overflow:auto}nav button,.smallbtn{background:#0b2233;border:1px solid #225369;border-radius:8px;padding:11px 17px;white-space:nowrap}nav button.active,.smallbtn:hover{background:#123d50;border-color:var(--cyan);color:var(--cyan)}main{max-width:1500px;margin:auto;padding:12px 26px 35px}.heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.heading h1{font-size:19px;letter-spacing:.08em;margin:0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.card{background:linear-gradient(145deg,#123347cc,var(--panel));border:1px solid var(--line);border-radius:12px;min-height:165px;padding:18px;position:relative;overflow:hidden;box-shadow:inset 0 1px #a0eaff14}.card:before{content:"";position:absolute;left:0;top:0;width:42px;height:2px;background:var(--cyan)}.card h2{font-size:12px;color:#8ed3e2;text-transform:uppercase;letter-spacing:.12em;margin:0 0 18px}.big{font-size:32px;color:var(--cyan);font-weight:750}.soft{color:var(--muted);line-height:1.6}.wide{grid-column:span 2}.status{font-size:11px;color:#e7b977;margin-top:12px}.btn{border:1px solid #33758c;background:#11394a;border-radius:7px;padding:9px 13px;margin-top:12px}.btn:focus-visible,nav button:focus-visible{outline:2px solid white}.footer{padding:12px 26px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.green{color:#71edc4}.weatherIcon{font-size:32px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.input{background:#061622;color:white;border:1px solid #32637a;border-radius:6px;padding:9px;width:min(100%,280px)}.trainColumns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.trainDirection{border:1px solid #245269;border-radius:9px;padding:13px;background:#061b2a}.trainDirection h3{font-size:13px;color:var(--cyan);margin:0 0 12px}.trainItem{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #1c5065;padding:9px 0}.trainTime{font-size:20px;font-weight:750;color:#e1f7ff}.trainStatus{font-size:11px;color:#71edc4}.trainStatus.alert{color:#f3b276}.hidden{display:none}@media(max-width:650px){.trainColumns{grid-template-columns:1fr}}.sub{font-size:12px;color:#9cc2d0}a{color:var(--cyan)}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wide{grid-column:span 2}}@media(max-width:520px){header{padding:15px}.brand{font-size:19px}.clock{font-size:23px}nav{padding:10px 15px}main{padding:10px 15px}.grid{gap:9px}.card{padding:13px;min-height:155px}.big{font-size:25px}.footer{padding:12px 15px}}@media(prefers-reduced-motion:no-preference){.card{transition:border-color .2s,transform .2s}.card:hover{border-color:#3c9bb2;transform:translateY(-2px)}} 
</style></head><body>
<header><div><div class="brand">J.A.R.V.I.S.</div><div class="micro">Personal command interface · V0.3.1</div></div><div><div class="clock" id="clock">--:--:--</div><div class="micro" id="date" style="text-align:right"></div></div></header>
<nav aria-label="Navigation"><button data-tab="Accueil" class="active">⌂ Accueil</button><button data-tab="EPS">▦ EPS</button><button data-tab="Sport">◇ Sport</button><button data-tab="Multimédia">♫ Multimédia</button><button data-tab="Réglages">⚙ Réglages</button></nav>
<main><div class="heading"><h1 id="pageTitle">CENTRE DE CONTRÔLE</h1><span class="micro green">● Interface active</span></div><div id="cards" class="grid"></div></main>
<div class="footer"><span>JARVIS SYSTEMS · V0.3.1</span><span id="net">Météo active · Trains : connexion à configurer</span></div>
<script>
const $=id=>document.getElementById(id),state={tab:'Accueil',city:localStorage.getItem('jarvisCity')||'Paris',weather:null,weatherError:'',trains:null,trainError:'',trainUpdated:null,trainLoading:false,trainEndpoint:localStorage.getItem('jarvisTrainEndpoint')||''};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tick(){let d=new Date();$('clock').textContent=d.toLocaleTimeString('fr-FR');$('date').textContent=d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).toUpperCase()}tick();setInterval(tick,1000);
function card(name,content,wide=false){return `<section class="card ${wide?'wide':''}"><h2>${name}</h2>${content}</section>`}
function placeholder(label,detail){return `<div class="soft">${detail}</div><div class="status">◌ ${label} · À connecter dans une prochaine version</div>`}
function weatherCard(){let w=state.weather;return card('☀ Météo · '+esc(state.city),w?`<div class="row"><span class="weatherIcon">${w.icon}</span><span class="big">${Math.round(w.temp)}°C</span></div><div class="soft">${esc(w.description)} · Vent ${Math.round(w.wind)} km/h</div><div class="sub">Actualisation toutes les 15 min</div>`:`<div class="soft">${esc(state.weatherError||'Chargement des données météo…')}</div><button class="btn" data-action="refresh">Réessayer</button>`)}
function trainClock(value){
 if(!value)return '--:--';
 const date=new Date(value);
 if(!Number.isNaN(date.getTime()))return new Intl.DateTimeFormat('fr-FR',{timeZone:'Europe/Paris',hour:'2-digit',minute:'2-digit',hour12:false}).format(date);
 return /^\d{1,2}:\d{2}$/.test(String(value))?String(value):'--:--';
}
function trainStatus(status){
 const raw=String(status||'');
 const statuses={onTime:'À l’heure',delayed:'Retard',cancelled:'Supprimé',early:'En avance',noReport:'Horaire théorique',unknown:'Horaire annoncé'};
 return statuses[raw]||raw||'Horaire annoncé';
}
function trainCard(){
 const groups=[['paris','→ Paris'],['pontoise','→ Pontoise']];
 const sections=groups.map(([key,label])=>{
  const rows=state.trains?.[key];
  let content;
  if(!Array.isArray(rows))content=`<div class="soft">${esc(state.trainError||'Connexion aux horaires à configurer.')}</div>`;
  else if(!rows.length)content='<div class="soft">Aucun prochain train annoncé.</div>';
  else content=rows.slice(0,5).map(t=>{
   const status=trainStatus(t.status);
   const alert=!['À l’heure','Horaire annoncé','Horaire théorique'].includes(status);
   return `<div class="trainItem"><div><div class="trainTime">${esc(trainClock(t.time))}</div><div class="sub">${esc(t.destination||label)}</div></div><div class="trainStatus ${alert?'alert':''}">${esc(status)}</div></div>`;
  }).join('');
  return `<div class="trainDirection"><h3>${label}</h3>${content}</div>`;
 }).join('');
 const source=state.trains?'Île-de-France Mobilités · PRIM':'API à connecter';
 const updated=state.trainUpdated?'Dernière actualisation : '+esc(state.trainUpdated):'Aucun horaire en direct chargé';
 const error=state.trainError&&state.trains?`<div class="status">${esc(state.trainError)}</div>`:'';
 return card('🚆 Transilien · Franconville – Le Plessis-Bouchard',`<div class="trainColumns">${sections}</div><div class="row"><button class="btn" data-action="trains-refresh">↻ Actualiser</button><button class="btn" data-action="transit">⚙ Configurer</button></div><div class="sub">${updated} · Source : ${source} · Actualisation automatique : 60 s</div>${error}`,true)
}
async function fetchTrains(){
 if(!state.trainEndpoint){state.trains=null;state.trainError='Ajoute une URL de service sécurisée dans Réglages.';render();return}
 if(state.trainLoading)return;
 state.trainLoading=true;
 try{
  const r=await fetch(state.trainEndpoint,{cache:'no-store'});
  if(!r.ok)throw Error('HTTP '+r.status);
  const data=await r.json();
  if(data.error)throw Error(String(data.error));
  if(!Array.isArray(data.paris)||!Array.isArray(data.pontoise))throw Error('Format inattendu : paris et pontoise doivent être des tableaux');
  state.trains={paris:data.paris,pontoise:data.pontoise};
  state.trainError='';
  state.trainUpdated=new Date().toLocaleTimeString('fr-FR');
 }catch(e){
  state.trainError='Actualisation impossible : '+e.message+(state.trains?' (derniers horaires conservés)':'');
 }finally{state.trainLoading=false;render()}
}
function home(){return [
card('◉ État du système','<div class="big">ONLINE</div><div class="soft">Bienvenue dans ton cockpit personnel.</div><div class="sub">Version tactile et multi-écrans</div>',true),
weatherCard(),
trainCard(),
card('▦ Agenda',placeholder('Calendrier','Prochains cours, rendez-vous et événements')),
card('🎓 Assistant EPS',placeholder('EPS','Séances, classes et ressources pédagogiques')),
card('◇ Musculation',placeholder('Suivi sportif','Séance du jour et progression')),
card('⚽ Benfica',placeholder('Football','Prochain match et derniers résultats')),
card('♫ Spotify',placeholder('Musique','Titre en cours et commandes')),
card('🐈 Kishta',`<div class="big">🐈‍⬛</div><div class="soft">Espace Kishta · Galerie à personnaliser</div>`)
].join('')}
function page(){if(state.tab==='Accueil')return home();if(state.tab==='EPS')return card('🎓 Assistant EPS',placeholder('Assistant','Fiches de séances, classes et documents'),true)+card('▦ Agenda',placeholder('Calendrier','Emploi du temps et prochains cours'))+card('📚 CAPEPS',placeholder('Révisions','Entraînements et ressources'));if(state.tab==='Sport')return card('◇ Musculation',placeholder('Musculation','Séances et statistiques'),true)+card('⚽ Benfica',placeholder('Football','Scores et calendrier'))+card('◎ Objectifs',placeholder('Objectifs','Progression et rappels'));if(state.tab==='Multimédia')return card('♫ Spotify',placeholder('Spotify','Lecteur et commandes'),true)+card('🐈 Kishta','<div class="big">🐈‍⬛</div><div class="soft">Photos et animations à ajouter</div>')+card('◉ Ambiance','<div class="soft">Le mode horloge minimaliste arrivera ultérieurement.</div>');return card('⚙ Préférences',`<label for="city" class="soft">Ville pour la météo</label><div class="row" style="margin-top:12px"><input id="city" class="input" maxlength="60" value="${esc(state.city)}" placeholder="Paris"><button class="btn" data-action="city">Enregistrer</button></div><p class="sub">Cette préférence est sauvegardée uniquement dans ce navigateur. La synchronisation multi-appareils viendra plus tard.</p>`,true)+card('🚆 Connexion Transilien',`<label for="trainEndpoint" class="soft">URL HTTPS de ton service d’horaires (sans clé API dans l’URL)</label><div class="row" style="margin-top:12px"><input id="trainEndpoint" class="input" style="width:min(100%,520px)" value="${esc(state.trainEndpoint)}" placeholder="https://.../api/trains"><button class="btn" data-action="train-endpoint">Enregistrer</button></div><p class="sub">Le service doit renvoyer du JSON avec deux tableaux « paris » et « pontoise », chacun contenant des objets {time, destination, status}. Ne colle jamais de clé PRIM ici : le dépôt GitHub est public.</p>`,true)+card('ℹ Version','<div class="soft">V0.3.1 · Météo et interface tactile. Horaires Transilien connectables à PRIM via Cloudflare.</div>')}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));$('pageTitle').textContent=({'Accueil':'CENTRE DE CONTRÔLE','EPS':'ESPACE EPS','Sport':'CENTRE SPORTIF','Multimédia':'MULTIMÉDIA','Réglages':'PARAMÈTRES'})[state.tab];$('cards').innerHTML=page()}
document.addEventListener('click',e=>{let t=e.target.closest('[data-tab]');if(t){state.tab=t.dataset.tab;render()}let a=e.target.closest('[data-action]');if(!a)return;if(a.dataset.action==='refresh')fetchWeather();if(a.dataset.action==='transit'){state.tab='Réglages';render()}if(a.dataset.action==='trains-refresh')fetchTrains();if(a.dataset.action==='train-endpoint'){let v=$('trainEndpoint').value.trim();if(v&&!/^https:\/\//.test(v)){alert('Utilise une adresse HTTPS.');return}state.trainEndpoint=v;localStorage.setItem('jarvisTrainEndpoint',v);fetchTrains()} if(a.dataset.action==='city'){let v=$('city').value.trim();if(v){state.city=v;localStorage.setItem('jarvisCity',v);state.weather=null;state.tab='Accueil';render();fetchWeather()}}});
function describe(code){if(code===0)return ['☀','Ciel dégagé'];if(code<=3)return ['⛅','Partiellement nuageux'];if(code<=48)return ['🌫','Brume ou brouillard'];if(code<=67)return ['🌧','Pluie'];if(code<=77)return ['❄','Neige'];if(code<=82)return ['🌦','Averses'];if(code<=86)return ['❄','Averses de neige'];if(code>=95)return ['⛈','Orages'];return ['☁','Conditions variables']}
async function fetchWeather(){try{state.weatherError='';const g=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(state.city)+'&count=1&language=fr&format=json');if(!g.ok)throw Error('Service de géolocalisation indisponible');const gj=await g.json();if(!gj.results?.length)throw Error('Ville introuvable');const loc=gj.results[0];const u='https://api.open-meteo.com/v1/forecast?latitude='+loc.latitude+'&longitude='+loc.longitude+'&current=temperature_2m,weather_code,wind_speed_10m&timezone=auto';const r=await fetch(u);if(!r.ok)throw Error('Service météo indisponible');const j=await r.json();const [icon,description]=describe(j.current.weather_code);state.weather={temp:j.current.temperature_2m,wind:j.current.wind_speed_10m,icon,description};}catch(e){state.weather=null;state.weatherError='Météo indisponible : '+e.message+'. Vérifie ta connexion.'}render()}
render();fetchWeather();fetchTrains();setInterval(fetchWeather,15*60*1000);setInterval(()=>{if(state.trainEndpoint)fetchTrains()},60*1000);if('serviceWorker' in navigator && location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
