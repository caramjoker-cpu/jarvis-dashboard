<style>
:root{--cyan:#5fe7ff;--muted:#87aab9;--line:#1c5065;--panel:#0a2030d9}*{box-sizing:border-box}body{margin:0;background:#050c16;color:#e1f7ff;font:14px system-ui,-apple-system,sans-serif;min-height:100vh;background-image:radial-gradient(ellipse at 48% 5%,#12415b70,transparent 65%),linear-gradient(#0d253322 1px,transparent 1px),linear-gradient(90deg,#0d253322 1px,transparent 1px);background-size:auto,36px 36px,36px 36px}button,input,select{font:inherit}button{cursor:pointer;color:inherit}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 26px;border-bottom:1px solid var(--line)}.brand{font-size:25px;letter-spacing:.25em;color:var(--cyan);font-weight:750;text-shadow:0 0 20px #24c7ff55}.micro{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}.clock{font-size:30px;font-variant-numeric:tabular-nums;font-weight:650;text-align:right}nav{display:flex;gap:8px;padding:12px 26px;overflow:auto}nav button,.smallbtn{background:#0b2233;border:1px solid #225369;border-radius:8px;padding:11px 17px;white-space:nowrap}nav button.active,.smallbtn:hover{background:#123d50;border-color:var(--cyan);color:var(--cyan)}main{max-width:1500px;margin:auto;padding:12px 26px 35px}.heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.heading h1{font-size:19px;letter-spacing:.08em;margin:0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.card{background:linear-gradient(145deg,#123347cc,var(--panel));border:1px solid var(--line);border-radius:12px;min-height:165px;padding:18px;position:relative;overflow:hidden;box-shadow:inset 0 1px #a0eaff14}.card:before{content:"";position:absolute;left:0;top:0;width:42px;height:2px;background:var(--cyan)}.card h2{font-size:12px;color:#8ed3e2;text-transform:uppercase;letter-spacing:.12em;margin:0 0 18px}.big{font-size:32px;color:var(--cyan);font-weight:750}.soft{color:var(--muted);line-height:1.6}.wide{grid-column:span 2}.status{font-size:11px;color:#e7b977;margin-top:12px}.btn{border:1px solid #33758c;background:#11394a;border-radius:7px;padding:9px 13px;margin-top:12px}.btn:focus-visible,nav button:focus-visible{outline:2px solid white}.footer{padding:12px 26px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.green{color:#71edc4}.weatherIcon{font-size:32px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.input{background:#061622;color:white;border:1px solid #32637a;border-radius:6px;padding:9px;width:min(100%,280px)}.trainColumns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.trainDirection{border:1px solid #245269;border-radius:9px;padding:13px;background:#061b2a}.trainDirection h3{font-size:13px;color:var(--cyan);margin:0 0 12px}.trainItem{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #1c5065;padding:9px 0}.trainTime{font-size:20px;font-weight:750;color:#e1f7ff}.trainStatus{font-size:11px;color:#71edc4}.trainStatus.alert{color:#f3b276}.trainDelay{font-size:11px;color:#f3b276;margin-top:3px}.trainEmpty{padding:12px 0}.trainItem .sub{overflow-wrap:anywhere}.hidden{display:none}@media(max-width:650px){.trainColumns{grid-template-columns:1fr}}.sub{font-size:12px;color:#9cc2d0}a{color:var(--cyan)}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wide{grid-column:span 2}}@media(max-width:520px){header{padding:15px}.brand{font-size:19px}.clock{font-size:23px}nav{padding:10px 15px}main{padding:10px 15px}.grid{gap:9px}.card{padding:13px;min-height:155px}.big{font-size:25px}.footer{padding:12px 15px}}@media(prefers-reduced-motion:no-preference){.card{transition:border-color .2s,transform .2s}.card:hover{border-color:#3c9bb2;transform:translateY(-2px)}} 

.agendaList{display:grid;gap:8px}.agendaEvent{display:flex;gap:12px;align-items:flex-start;padding:11px;border:1px solid #245269;border-left:3px solid var(--cyan);border-radius:8px;background:#061b2a}.agendaEvent.primark{border-left-color:#efb46c}.agendaEvent.oeben{border-left-color:#5fe7ff}.agendaEvent.tillion{border-left-color:#7ee5a6}.agendaEvent.perso{border-left-color:#cba6ff}.agendaTime{min-width:100px;font-weight:750;color:#e1f7ff;font-variant-numeric:tabular-nums}.agendaDetails{flex:1;min-width:0}.agendaTitle{font-weight:700}.agendaControls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}.agendaControls input{width:auto}.agendaTag{font-size:11px;color:var(--muted)}.agendaEmpty{padding:16px;border:1px dashed #245269;border-radius:8px;color:var(--muted)}.agendaBadge{font-size:11px;color:#71edc4}.agendaEvent button{margin:0;padding:5px 9px}.agendaDay{padding:12px;border:1px solid #245269;border-radius:9px;background:#061b2a}.agendaDay h3{margin:0 0 9px;color:var(--cyan);font-size:14px}.agendaWeek{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.agendaWeek .agendaEvent{padding:8px;gap:7px}.agendaWeek .agendaTime{min-width:70px;font-size:12px}.agendaWeek .agendaTitle{font-size:12px}.agendaForm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.agendaForm label{display:grid;gap:4px;font-size:12px;color:var(--muted)}.agendaForm input,.agendaForm select{width:100%;background:#061622;border:1px solid #32637a;color:white;border-radius:6px;padding:9px}.agendaForm .full{grid-column:span 2}@media(max-width:680px){.agendaWeek,.agendaForm{grid-template-columns:1fr}.agendaForm .full{grid-column:span 1}.agendaTime{min-width:82px}}

</style></head><body>
<header><div><div class="brand">J.A.R.V.I.S.</div><div class="micro">Personal command interface · V0.7</div></div><div><div class="clock" id="clock">--:--:--</div><div class="micro" id="date" style="text-align:right"></div></div></header>
<nav aria-label="Navigation"><button data-tab="Accueil" class="active">⌂ Accueil</button><button data-tab="EPS">▦ EPS</button><button data-tab="Sport">◇ Sport</button><button data-tab="Benfica">⚽ Benfica</button><button data-tab="Multimédia">♫ Multimédia</button><button data-tab="Kishta">🐈 Kishta</button><button data-tab="Réglages">⚙ Réglages</button></nav>
<main><div class="heading"><h1 id="pageTitle">CENTRE DE CONTRÔLE</h1><span class="micro green">● Interface active</span></div><div id="cards" class="grid"></div></main>
<div class="footer"><span>JARVIS SYSTEMS · V0.7</span><span id="net">Météo active · Trains : connexion à configurer</span></div>
<script>
const $=id=>document.getElementById(id),state={tab:'Accueil',city:localStorage.getItem('jarvisCity')||'Paris',weather:null,weatherError:'',trains:null,trainError:'',trainUpdated:null,trainLoading:false,trainEndpoint:localStorage.getItem('jarvisTrainEndpoint')||''};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tick(){let d=new Date();$('clock').textContent=d.toLocaleTimeString('fr-FR');$('date').textContent=d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).toUpperCase()}tick();setInterval(tick,1000);
function card(name,content,wide=false){return `<section class="card ${wide?'wide':''}"><h2>${name}</h2>${content}</section>`}
function placeholder(label,detail){return `<div class="soft">${detail}</div><div class="status">◌ ${label} · À connecter dans une prochaine version</div>`}
function weatherCard(){let w=state.weather;return card('☀ Météo · '+esc(state.city),w?`<div class="row"><span class="weatherIcon">${w.icon}</span><span class="big">${Math.round(w.temp)}°C</span></div><div class="soft">${esc(w.description)} · Vent ${Math.round(w.wind)} km/h</div><div class="sub">Actualisation toutes les 15 min</div>`:`<div class="soft">${esc(state.weatherError||'Chargement des données météo…')}</div><button class="btn" data-action="refresh">Réessayer</button>`)}
function trainClock(value){
 if(!value)return '--:--';
 const date=new Date(value);
 if(!Number.isNaN(date.getTime()))return new Intl.DateTimeFormat('fr-FR',{timeZone:'Europe/Paris',hour:'2-digit',minute:'2-digit',hour12:false}).format(date);
 return /^\d{1,2}:\d{2}$/.test(String(value))?String(value):'--:--';
}
function trainStatus(status){
 const raw=String(status||'').trim();
 const statuses={ontime:'À l’heure',delayed:'Retard',cancelled:'Supprimé',canceled:'Supprimé',early:'En avance',noreport:'Horaire théorique',unknown:'Horaire annoncé'};
 return statuses[raw.toLowerCase()]||raw||'Horaire annoncé';
}
function trainDelay(train){
 const expected=Date.parse(train.expected||train.time||'');
 const scheduled=Date.parse(train.scheduled||'');
 if(!Number.isFinite(expected)||!Number.isFinite(scheduled))return '';
 const minutes=Math.round((expected-scheduled)/60000);
 return minutes>0?`+${minutes} min de retard`:minutes<0?`${minutes} min d’avance`:'';
}
function upcomingTrains(rows){
 const now=Date.now();
 return rows.filter(t=>{
  const time=Date.parse(t.time||'');
  return !Number.isFinite(time)||time>=now-120000;
 }).slice(0,5);
}
function trainCard(){
 const groups=[['paris','→ Paris'],['pontoise','→ Pontoise']];
 const sections=groups.map(([key,label])=>{
  const rows=state.trains?.[key];
  let content;
  if(!Array.isArray(rows))content=`<div class="soft">${esc(state.trainError||'Connexion aux horaires à configurer.')}</div>`;
  else if(!upcomingTrains(rows).length)content='<div class="soft trainEmpty">Aucun prochain train annoncé.</div>';
  else content=upcomingTrains(rows).map(t=>{
   const status=trainStatus(t.status);
   const delay=trainDelay(t);
    const alert=!['À l’heure','Horaire annoncé','Horaire théorique'].includes(status)||!!delay;
   return `<div class="trainItem"><div><div class="trainTime">${esc(trainClock(t.time))}</div><div class="sub">${esc(t.destination||label)}</div>${delay?`<div class="trainDelay">${esc(delay)}</div>`:''}</div><div class="trainStatus ${alert?'alert':''}">${esc(status)}</div></div>`;
  }).join('');
  return `<div class="trainDirection"><h3>${label}</h3>${content}</div>`;
 }).join('');
 const source=state.trains?'Île-de-France Mobilités · PRIM':'API à connecter';
 const updated=state.trainUpdated?'Dernière actualisation : '+esc(state.trainUpdated):'Aucun horaire en direct chargé';
 const error=state.trainError&&state.trains?`<div class="status">${esc(state.trainError)}</div>`:'';
 return card('🚆 Transilien · Franconville – Le Plessis-Bouchard',`<div class="trainColumns">${sections}</div><div class="row"><button class="btn" data-action="trains-refresh">↻ Actualiser</button><button class="btn" data-action="transit">⚙ Configurer</button></div><div class="sub">${updated} · Source : ${source} · Actualisation automatique : 60 s</div>${error}`,true)
}
async function fetchTrains(){
 if(!state.trainEndpoint){state.trains=null;state.trainError='Ajoute une URL de service sécurisée dans Réglages.';render();return}
 if(state.trainLoading)return;
 state.trainLoading=true;
 try{
  const r=await fetch(state.trainEndpoint,{cache:'no-store'});
  if(!r.ok)throw Error('HTTP '+r.status);
  const data=await r.json();
  if(data.error)throw Error(String(data.error));
  if(!Array.isArray(data.paris)||!Array.isArray(data.pontoise))throw Error('Format inattendu : paris et pontoise doivent être des tableaux');
  state.trains={paris:data.paris,pontoise:data.pontoise};
  state.trainError='';
  state.trainUpdated=new Date().toLocaleTimeString('fr-FR');
 }catch(e){
  state.trainError='Actualisation impossible : '+e.message+(state.trains?' (derniers horaires conservés)':'');
 }finally{state.trainLoading=false;render()}
}

// Emploi du temps local : aucune information scolaire n'est envoyée à un serveur.
const fixedSchedule=[
 {day:1,start:'08:05',end:'09:55',title:'EPS · 4e ME1',place:'Collège Jean-François Oeben',type:'oeben'},
 {day:1,start:'10:00',end:'12:00',title:'EPS · 5e ME4',place:'Collège Jean-François Oeben',type:'oeben'},
 {day:1,start:'13:30',end:'15:20',title:'Natation · 6e Agatha et Manouchian',place:'Collège Germaine Tillion',type:'tillion'},
 {day:1,start:'15:35',end:'16:35',title:'EPS · 5e Jaurès',place:'Collège Germaine Tillion',type:'tillion'},
 {day:2,start:'13:25',end:'14:45',title:'EPS · 5e Austen',place:'Collège Germaine Tillion',type:'tillion'},
 {day:2,start:'15:35',end:'16:35',title:'Natation · 6e Orphée',place:'Collège Germaine Tillion',type:'tillion'},
 {day:3,start:'08:05',end:'09:55',title:'EPS · 4e ME1 (1 semaine sur 2)',place:'Collège Jean-François Oeben',type:'oeben',alternate:true},
 {day:5,start:'08:55',end:'10:00',title:'EPS · 5e Austen',place:'Collège Germaine Tillion',type:'tillion'},
 {day:5,start:'10:00',end:'11:25',title:'EPS · 5e Jaurès',place:'Collège Germaine Tillion',type:'tillion'},
 {day:0,start:'11:00',end:'20:00',title:'Travail · Primark',place:'Primark',type:'primark'}
];
const scheduleKey='jarvisV04PersonalEvents';
let personalEvents=[];
try{const stored=JSON.parse(localStorage.getItem(scheduleKey)||'[]');if(Array.isArray(stored))personalEvents=stored.filter(x=>x&&typeof x==='object').slice(0,300)}catch(e){}
const localDayKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dayFromKey=k=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(k||'');return m?new Date(+m[1],+m[2]-1,+m[3]):new Date(NaN)};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
function wednesdayActive(date){const anchor=new Date(2026,9,14,12);const test=new Date(date.getFullYear(),date.getMonth(),date.getDate(),12);return Math.round((test-anchor)/86400000/7)%2===0}
function eventsForDate(d){
 const date=localDayKey(d);
 const regular=fixedSchedule.filter(e=>e.day===d.getDay()&&(!e.alternate||wednesdayActive(d))).map(e=>({...e,date,personal:false}));
 const custom=personalEvents.filter(e=>e.date===date).map(e=>({...e,type:'perso',place:e.place||'Événement personnel',personal:true}));
 return regular.concat(custom).sort((a,b)=>a.start.localeCompare(b.start));
}
function formatDay(d){return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}
function eventMarkup(e){return `<div class="agendaEvent ${esc(e.type)}"><div class="agendaTime">${esc(e.start)}–${esc(e.end)}</div><div class="agendaDetails"><div class="agendaTitle">${esc(e.title)}</div><div class="agendaTag">${esc(e.place)}</div></div>${e.personal?`<button class="smallbtn" data-action="delete-event" data-id="${esc(e.id)}" aria-label="Supprimer cet événement">✕</button>`:''}</div>`}
function nextEvent(){const now=new Date();for(let i=0;i<15;i++){const d=addDays(now,i);for(const e of eventsForDate(d)){const end=dayFromKey(e.date);const [h,m]=e.end.split(':').map(Number);end.setHours(h,m,0,0);if(end>now)return e}}return null}
function agendaPreview(){const e=nextEvent();return card('▦ Agenda · Prochaine activité',e?`<div class="agendaBadge">${esc(formatDay(dayFromKey(e.date)))}</div><div class="big" style="font-size:23px">${esc(e.start)} – ${esc(e.end)}</div><div>${esc(e.title)}</div><div class="soft">${esc(e.place)}</div><button class="btn" data-action="open-agenda">Voir mon planning</button>`:'<div class="soft">Aucune activité prévue dans les 15 prochains jours.</div>',false)}
function agendaPage(){

const BENFICA_ENDPOINT='https://jarvis-benfica.caramjoker.workers.dev/';
let benficaData=null,benficaError='',benficaUpdated=0,benficaLoading=false;
const BENFICA_CACHE='jarvisBenficaCacheV061';
try{const saved=JSON.parse(localStorage.getItem(BENFICA_CACHE)||'null');if(saved&&saved.data&&Date.now()-saved.at<6*3600000){benficaData=saved.data;benficaUpdated=saved.at}}catch(e){}
function benficaValidMatch(m){return m&&typeof m.utcDate==='string'&&Number.isFinite(new Date(m.utcDate).getTime())}
function benficaNext(){return (benficaData?.nextMatches||[]).filter(benficaValidMatch).filter(m=>new Date(m.utcDate).getTime()>Date.now()-2*3600000).sort((a,b)=>new Date(a.utcDate)-new Date(b.utcDate))[0]||null}
function benficaCountdown(){
 const m=benficaNext();if(!m)return 'En attente du prochain match';
 const diff=new Date(m.utcDate).getTime()-Date.now();if(diff<=0)return 'Match en cours ou débuté';
 const days=Math.floor(diff/86400000),hours=Math.floor(diff%86400000/3600000),mins=Math.floor(diff%3600000/60000);
 return days?`J−${days} · ${hours} h ${mins} min`:`Dans ${hours} h ${mins} min`;
}
function benficaOpponent(m){if(!m)return 'À confirmer';return /benfica/i.test(m.home||'')?m.away||'Adversaire à confirmer':m.home||'Adversaire à confirmer'}
function benficaDate(s){const d=new Date(s);return Number.isFinite(d.getTime())?d.toLocaleString('fr-FR',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'Date indisponible'}
function benficaCard(){
 const m=benficaNext(),home=m&&/benfica/i.test(m.home||'');
 const status=benficaLoading?'Mise à jour en cours…':benficaError?'Actualisation indisponible · '+esc(benficaError):benficaData?'Données football-data.org · actualisées '+esc(new Date(benficaUpdated).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})):'Connexion au calendrier…';
 return card('⚽ SL Benfica',`<div class="benficaHero"><strong>${m?`SL BENFICA ${home?'—':'@'} ${esc(benficaOpponent(m))}`:'SL BENFICA'}</strong><div class="soft">${m?`${esc(benficaDate(m.utcDate))} · ${esc(m.competition||'Compétition non précisée')}`:'Prochain match indisponible'}</div><div class="big" style="font-size:22px">${esc(benficaCountdown())}</div><div class="sub">${status}</div></div><button class="btn" data-action="open-benfica">Ouvrir le module Benfica</button>`);
}
function benficaMatchRows(matches,finished){
 if(!matches?.length)return '<div class="soft">Aucune donnée disponible pour le moment.</div>';
 return `<div class="benficaMatches">${matches.slice(0,5).map(m=>`<div class="benficaRow"><span>${esc(benficaDate(m.utcDate))}</span><strong>${esc(m.home||'—')} ${finished&&m.homeScore!=null&&m.awayScore!=null?`<span class="benficaScore">${m.homeScore} – ${m.awayScore}</span>`:'–'} ${esc(m.away||'—')}</strong><span class="sub">${esc(m.competition||'')}</span></div>`).join('')}</div>`;
}
function benficaPage(){
 const last=(benficaData?.lastMatches||[]).filter(benficaValidMatch).sort((a,b)=>new Date(b.utcDate)-new Date(a.utcDate));
 const next=(benficaData?.nextMatches||[]).filter(benficaValidMatch).sort((a,b)=>new Date(a.utcDate)-new Date(b.utcDate));
 const standings=benficaData?.standings||[];
 const rows=standings.length?`<div class="benficaTableWrap"><table class="benficaTable"><thead><tr><th>#</th><th>Club</th><th>MJ</th><th>Pts</th></tr></thead><tbody>${standings.map(r=>`<tr class="${/benfica/i.test(r.team||'')?'benficaUs':''}"><td>${Number(r.position)||'—'}</td><td>${esc(r.team||'—')}</td><td>${Number(r.played)||0}</td><td>${Number(r.points)||0}</td></tr>`).join('')}</tbody></table></div>`:'<div class="soft">Classement indisponible pour ce forfait ou cette période.</div>';

 return benficaCard()+card('📅 Prochains matchs',benficaMatchRows(next,false),true)+card('🏁 Derniers résultats',benficaMatchRows(last,true),true)+card('🏆 Classement · Liga Portugal',rows,true)+card('🔄 Actualisation',`<div class="soft">Mise à jour automatique toutes les 10 minutes. Les heures sont affichées dans le fuseau horaire de ton appareil.</div>${info?`<div class="sub">Certaines données sont indisponibles : ${esc(info)}</div>`:''}<div class="benficaLinks"><button class="btn" data-action="refresh-benfica">Actualiser maintenant</button><a href="https://www.slbenfica.pt/" target="_blank" rel="noopener noreferrer">Benfica officiel ↗</a></div>`,true);

async function fetchBenfica(force=false){
 if(benficaLoading||(!force&&Date.now()-benficaUpdated<10*60*1000))return;
 benficaLoading=true;benficaError='';if(state.tab==='Benfica')render();
 try{
  const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),12000);
  let response;try{response=await fetch(BENFICA_ENDPOINT,{cache:'no-store',signal:controller.signal})}finally{clearTimeout(timeout)}
  if(!response.ok)throw Error('Service HTTP '+response.status);
  const data=await response.json();
  if(!data||!Array.isArray(data.nextMatches)||!Array.isArray(data.lastMatches)||!Array.isArray(data.standings))throw Error('Format de réponse inattendu');
  benficaData=data;benficaUpdated=Date.now();
  try{localStorage.setItem(BENFICA_CACHE,JSON.stringify({data,at:benficaUpdated}))}catch(e){}
 }catch(e){benficaError=e.name==='AbortError'?'Délai dépassé':e.message||'Erreur réseau'}
 finally{benficaLoading=false;render()}
}

if(a.dataset.action==='open-benfica'){state.tab='Benfica';render();return}if(a.dataset.action==='refresh-benfica'){fetchBenfica(true);return}if(a.dataset.action==='open-gym'){state.tab='Sport';render();return}if(a.dataset.action==='gym-add'){gymAdd();return}if(a.dataset.action==='gym-export'){gymExport();return}if(a.dataset.action==='gym-delete'){if(!confirm('Supprimer cet exercice de l’historique ?'))return;gymEntries=gymEntries.filter(x=>x.id!==a.dataset.id);localStorage.setItem(gymKey,JSON.stringify(gymEntries));render();return}if(a.dataset.action==='open-agenda'){state.tab='EPS';render();return}

 if(a.dataset.action==='refresh')fetchWeather();if(a.dataset.action==='transit'){state.tab='Réglages';render()}if(a.dataset.action==='trains-refresh')fetchTrains();if(a.dataset.action==='train-endpoint'){let v=$('trainEndpoint').value.trim();if(v&&!/^https:\/\//.test(v)){alert('Utilise une adresse HTTPS.');return}state.trainEndpoint=v;localStorage.setItem('jarvisTrainEndpoint',v);fetchTrains()} if(a.dataset.action==='city'){let v=$('city').value.trim();if(v){state.city=v;localStorage.setItem('jarvisCity',v);state.weather=null;state.tab='Accueil';render();fetchWeather()}}});
function describe(code){if(code===0)return ['☀','Ciel dégagé'];if(code<=3)return ['⛅','Partiellement nuageux'];if(code<=48)return ['🌫','Brume ou brouillard'];if(code<=67)return ['🌧','Pluie'];if(code<=77)return ['❄','Neige'];if(code<=82)return ['🌦','Averses'];if(code<=86)return ['❄','Averses de neige'];if(code>=95)return ['⛈','Orages'];return ['☁','Conditions variables']}
async function fetchWeather(){try{state.weatherError='';const g=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(state.city)+'&count=1&language=fr&format=json');if(!g.ok)throw Error('Service de géolocalisation indisponible');const gj=await g.json();if(!gj.results?.length)throw Error('Ville introuvable');const loc=gj.results[0];const u='https://api.open-meteo.com/v1/forecast?latitude='+loc.latitude+'&longitude='+loc.longitude+'&current=temperature_2m,weather_code,wind_speed_10m&timezone=auto';const r=await fetch(u);if(!r.ok)throw Error('Service météo indisponible');const j=await r.json();const [icon,description]=describe(j.current.weather_code);state.weather={temp:j.current.temperature_2m,wind:j.current.wind_speed_10m,icon,description};}catch(e){state.weather=null;state.weatherError='Météo indisponible : '+e.message+'. Vérifie ta connexion.'}render()}
